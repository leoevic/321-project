global:
  scrape_interval:      15s
  evaluation_interval:  15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'node-exporter'
    basic_auth:
      username_file: ./monitoring_user
      password_file: ./monitoring_password
    static_configs:
      - targets:
        - '172.17.0.1:9100'
  - job_name: 'windows-exporter'
    static_configs:
      - targets:
        - '192.168.56.1:9182'
  - job_name: 'sensors'
    scrape_interval: 5s
    static_configs:
      - targets:
        - 'leonardoevic:8080'
