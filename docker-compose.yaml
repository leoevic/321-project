services:
  game:
    build: ./game
    privileged: true
    command: ['python', '-u', 'main.py']
    volumes:
      - './game:/usr/src/app/'
    restart: always
    depends_on:
      - mosquitto

  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - '1883:1883'
      - '9001:9001'
    volumes:
      - './mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf'
      - mosquitto_data:/mosquitto/data
    restart: always

  dashboard:
    image: nginx
    volumes:
      - ./dashboard:/usr/share/nginx/html/
    ports:
      - 80:80
    command: nginx -g "daemon off;"
    restart: always

volumes:
  mosquitto_data: