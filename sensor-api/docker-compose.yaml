services:
  webserver:
    build: .
    privileged: true
    command: ['python', '-u', 'main.py']
    volumes:
      - ./air_sensor.py:/usr/src/app/air_sensor.py
      - ./distance_sensor.py:/usr/src/app/distance_sensor.py
      - ./vibration.py:/usr/src/app/vibration.py
      - ./main.py:/usr/src/app/main.py
      - ./index.html:/usr/src/app/index.html
    ports:
      - 8080:8080
    restart: always
